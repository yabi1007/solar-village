<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>햇빛소득마을 이장메이커</title>

<style>
html,body{
    margin:0;
    padding:0;
    background:#222;
    height:100%;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.game{
    width:360px;
    height:778px;
    position:relative;
    overflow:hidden;
}

.screen{
    position:absolute;
    width:100%;
    height:100%;
    display:none;
}

#title-screen{
    display:block;
}

#title-screen img,
#character-screen img{
    width:360px;
    height:778px;
    object-fit:fill;
}

.hotspot{
    position:absolute;
    cursor:pointer;
}

.start-title{
    left:12.5%;
    top:73.2427%;
    width:73.6%;
    height:6.04%;
}

.gender{
    position:absolute;
    cursor:pointer;
}

.male{
    left:18%;
    top:52.38%;
    width:28.89%;
    height:13.59%;
}

.female{
    left:52.5%;
    top:52.38%;
    width:30.56%;
    height:14.1%;
}

.gender.selected{
    border:3px solid #f5c542;
    border-radius:15px;
    box-sizing:border-box;
}

.input-box{
    position:absolute;
    border:none;
    background:transparent;
    text-align:center;
    outline:none;
    padding:0;
    font-size:14px;
    color:#5b4630;
}

.input-box::placeholder{
    color:#c9bfa8;
    font-size:14px;
}

.name-input{
    left:23.5%;
    top:75.5%;
    width:60.28%;
    height:3.32%;
}

.village-input{
    left:24%;
    top:85.00%;
    width:58.89%;
    height:3.33%;
}

.create-button{
    position:absolute;
    left:15.55%;
    top:89.26%;
    width:68.89%;
    height:5.84%;
    cursor:pointer;
    background:transparent;
    border:none;
}

#prologue-screen img{
    width:360px;
    height:778px;
    object-fit:fill;
}

.dialogue{
    position:absolute;
    left:8%;
    top:60%;
    width:84%;
    height:22%;
    font-size:14px;
    line-height:1.7;
    color:#5b4630;
    white-space:pre-line;
}

.next-button{
    position:absolute;
    left:10%;
    top:92%;
    width:80%;
    height:6%;
    background:transparent;
    border:none;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="game">

<div id="title-screen" class="screen">
<img src="assets/images/title/title_background.png">
<div class="hotspot start-title" onclick="showScreen('character-screen')"></div>
</div>


<div id="character-screen" class="screen">

<img src="assets/images/characters/character_create_background.png">

<div id="male" class="gender male" onclick="selectGender('male')"></div>
<div id="female" class="gender female" onclick="selectGender('female')"></div>


<input
id="player-name"
class="input-box name-input"
maxlength="5"
placeholder="최대 5자까지 입력">


<input
id="village-name"
class="input-box village-input"
maxlength="7"
placeholder="최대 7자까지 입력">


<button class="create-button" onclick="createVillage()"></button>

</div>



<div id="prologue-screen" class="screen">
<img id="prologue-image" src="assets/images/prologue/scene01.png">

<div id="dialogue" class="dialogue"></div>

<button id="next-button" class="next-button"></button>
</div>

<div id="village-screen" class="screen">
<h2 id="welcome"></h2>
</div>

</div>

<script src="prologue.js"></script>
<script src="game.js"></script>

</body>
</html>
